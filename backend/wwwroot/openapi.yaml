openapi: 3.0.3
info:
  title: rate-setup API
  description: |
    Backend API for rate-setup — a head-to-head desk-setup voting site.
  version: 0.1.1

servers:
  - url: http://localhost:5065
    description: Local dev
  - url: https://api.ratesetup.example
    description: Production (placeholder)

tags:
  - name: Auth
    description: Google OAuth + current-user lookup
  - name: Setups
    description: A user's own setup posts (CRUD)
  - name: Vote
    description: Head-to-head pair fetch + submit
  - name: Saves
    description: Saving / unsaving other users' setups
  - name: Featured
    description: Setup of the Day
  - name: Report
    description: Reporting inappropriate setups
  - name: Dashboard
    description: Public leaderboard

# ─────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────
paths:
  # ── Auth ──────────────────────────────────────────────────────────
  /api/auth/login:
    get:
      tags: [Auth]
      summary: "[done] Start Google OAuth flow"
      security: []
      responses:
        "302":
          description: Redirect to Google consent screen

  /api/auth/me:
    get:
      tags: [Auth]
      summary: "[done] Current user from JWT"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: "[done] Clear cookie / signal client to drop JWT"
      responses:
        "204":
          description: Logged out

  # ── Setups (own) ──────────────────────────────────────────────────
  /api/setups:
    get:
      tags: [Setups]
      summary: "[done] List MY setups with win/loss counts"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupWithStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Setups]
      summary: "[done] Create a setup (max 2 per rolling 7 days)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupDto"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "400":
          description: Validation failed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Weekly upload limit (2) reached

  /api/setups/upload-url:
    post:
      tags: [Setups]
      summary: "[done] Get a short-lived SAS URL to upload an image directly to Azure Blob Storage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/setups/{id}:
    parameters:
      - $ref: "#/components/parameters/SetupId"
    get:
      tags: [Setups]
      summary: "[todo] Single setup detail"
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupWithStats"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Setups]
      summary: "[todo] Edit setup description (owner only)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSetupDto"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the owner
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Setups]
      summary: "[todo] Soft-delete (owner only)"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the owner
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Vote ──────────────────────────────────────────────────────────
  /api/vote:
    get:
      tags: [Vote]
      summary: "[done] Fetch a fresh pair of setups"
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
                  
        "404":
          description: Not enough setups to form a pair
    post:
      tags: [Vote]
      summary: "[done] Submit a vote"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteSubmit"
      responses:
        "200":
          description: Recorded; returns rating changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteSubmitResult"
        "400":
          description: Bad payload (e.g. winnerId == loserId)
        "429":
          description: Rate-limited (anti-abuse)

  /api/vote/count:
    get:
      tags: [Vote]
      summary: "[done] Number of votes this week"
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteCount"

  # ── Saves ─────────────────────────────────────────────────────────
  /api/setups/saves:
    get:
      tags: [Saves]
      summary: "[todo] List setups I've saved"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setup"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/setups/saves/{id}:
    parameters:
      - $ref: "#/components/parameters/SetupId"
    post:
      tags: [Saves]
      summary: "[todo] Save a setup (idempotent)"
      responses:
        "204":
          description: Saved (or already saved)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Saves]
      summary: "[todo] Unsave"
      responses:
        "204":
          description: Unsaved (or was not saved)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Report ────────────────────────────────────────────────────────
  /api/report/{id}:
    parameters:
      - $ref: "#/components/parameters/SetupId"
    post:
      tags: [Report]
      summary: "[todo] Report a setup"
      security: []
      responses:
        "204":
          description: Report recorded
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Featured ──────────────────────────────────────────────────────
  /api/setups/daily:
    get:
      tags: [Featured]
      summary: "[todo] Last 10 daily setups"
      description: Returns the 10 most recent daily winners, ordered from most recent to oldest.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/DailySetup"

  # ── Dashboard ─────────────────────────────────────────────────────
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: "[todo] Current week's top-N leaderboard"
      description: Returns the top N setups by win count within the current voting week (Monday–Sunday UTC).
      security: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [leaderboard]
                properties:
                  leaderboard:
                    type: array
                    items:
                      $ref: "#/components/schemas/SetupWithStats"


# ─────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued after Google OAuth (see /api/auth/login)

  parameters:
    SetupId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid JWT
    NotFound:
      description: Resource not found

  schemas:
    User:
      type: object
      required: [id, email, name, handle, imageUrl, createdAt, isActive]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        handle: { type: string }
        imageUrl: { type: string }
        createdAt: { type: string, format: date-time }
        isActive: { type: boolean, default: true }

    Setup:
      type: object
      required: [id, createdBy, imageUrl, description, rating, createdAt, isActive]
      properties:
        id: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        imageUrl: { type: string,  format: uri, description: Azure Blob Storage object key }
        description: { type: string }
        rating: { type: integer, description: Elo-style; default 800 }
        featuredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        isActive: { type: boolean, default: true }

    SetupWithStats:
      allOf:
        - $ref: "#/components/schemas/Setup"
        - type: object
          required: [wins, losses, creatorName]
          properties:
            wins: { type: integer }
            losses: { type: integer }
            creatorName: { type: string }

    DailySetup:
      allOf:
        - $ref: "#/components/schemas/SetupWithStats"
        - type: object
          required: [featuredAt]
          properties:
            featuredAt:
              type: string
              format: date-time
              description: The UTC timestamp when this setup was named daily winner

    Battle:
      type: object
      required: [battleId, setups]
      properties:
        battleId: { type: string, format: uuid }
        setups:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/Setup"

    VoteSubmit:
      type: object
      required: [battleId, winnerId, loserId]
      properties:
        battleId: { type: string, format: uuid }
        winnerId: { type: string, format: uuid }
        loserId: { type: string, format: uuid }

    VoteSubmitResult:
      type: object
      required: [battleId, winnerDiff, loserDiff]
      properties:
        battleId: { type: string, format: uuid }
        winnerDiff: { type: integer, description: Rating points gained by the winner }
        loserDiff: { type: integer, description: Rating points lost by the loser (negative) }

    VoteCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, description: Total votes cast in the past 24 hours }

    WeekInfo:
      type: object
      required: [weekStartsAt, weekEndsAt]
      properties:
        weekStartsAt:
          type: string
          format: date-time
          description: Monday 00:00 UTC of the current week
        weekEndsAt:
          type: string
          format: date-time
          description: Next Monday 00:00 UTC (exclusive end of the current week)

    EditSetupDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500

    CreateSetupDto:
      type: object
      required: [description, imageUrl]
      properties:
        description:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri

    UploadUrlDto:
      type: object
      required: [uploadUrl, imageUrl]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Short-lived Azure SAS URL — PUT the image directly to this URL
        imageUrl:
          type: string
          format: uri
          description: Permanent public URL to store in the setup after upload


# Default: every endpoint requires the JWT unless overridden by `security: []`
security:
  - bearerAuth: []
